[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campresso"
version = "4.1.6"
description = "CamPresso — Action, packed lighter. Compress and review Apple Photos videos."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "osxphotos==0.77.2",
]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.optional-dependencies]
legacy = ["tkinterdnd2==0.6.3", "pyobjc-framework-Photos; sys_platform == 'darwin'"]

[project.urls]
Repository = "https://github.com/SilvioGiancola/CamPresso"
Documentation = "https://github.com/SilvioGiancola/CamPresso/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/SilvioGiancola/CamPresso/issues"

[project.scripts]
campresso = "campresso.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["campresso*"]
namespaces = false

[tool.setuptools.package-data]
campresso = ["resources/*.applescript"]
