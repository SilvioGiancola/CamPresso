[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-video-library-converter"
version = "4.0.0"
description = "Review and replace Apple Photos videos with smaller compressed copies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "osxphotos==0.77.2",
]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.optional-dependencies]
legacy = ["tkinterdnd2==0.6.3", "pyobjc-framework-Photos; sys_platform == 'darwin'"]

[project.urls]
Repository = "https://github.com/SilvioGiancola/MacVideoLibraryConverter"
Documentation = "https://github.com/SilvioGiancola/MacVideoLibraryConverter/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/SilvioGiancola/MacVideoLibraryConverter/issues"

[project.scripts]
video-queue = "video_queue.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_queue*"]
namespaces = false

[tool.setuptools.package-data]
video_queue = ["resources/*.applescript"]
